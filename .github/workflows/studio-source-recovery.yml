name: Recover deployed Studio source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/studio-source-recovery.yml']
permissions:
  contents: read
jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read deployed source and seal it for local inspection
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RECIPIENT_PUBLIC_KEY: ''
        run: |
          node --input-type=module <<'NODE'
          import { createCipheriv, publicEncrypt, randomBytes, constants } from 'node:crypto';
          import { writeFile } from 'node:fs/promises';
          import { gzipSync } from 'node:zlib';
          const result = {};
          for (const name of ['aupositeur-shop-api','aupositeur-studio-api']) {
            result[name] = {};
            for (const path of ['', '/settings', '/deployments']) {
              const response = await fetch('https://api.cloudflare.com/client/v4/accounts/' + process.env.CF_ACCOUNT + '/workers/scripts/' + name + path, {
                headers: {Authorization:'Bearer ' + process.env.CF_TOKEN},
                redirect:'error',
              });
              if (!response.ok) throw Error(name + ' ' + (path || '/source') + ' HTTP ' + response.status);
              result[name][path || '/source'] = {
                type:response.headers.get('content-type'),
                body:Buffer.from(await response.arrayBuffer()).toString('base64'),
              };
            }
          }
          const key = randomBytes(32), iv = randomBytes(12);
          const cipher = createCipheriv('aes-256-gcm', key, iv);
          const payload = Buffer.concat([cipher.update(gzipSync(JSON.stringify(result))), cipher.final()]);
          const sealed = { key:publicEncrypt({key:Buffer.from(process.env.RECIPIENT_PUBLIC_KEY,'base64'), padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key), iv, tag:cipher.getAuthTag(), payload };
          await writeFile('workers-sealed.json', JSON.stringify(Object.fromEntries(Object.entries(sealed).map(([name,value])=>[name,value.toString('base64')]))));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-deployed-source
          path: workers-sealed.json
          retention-days: 1
