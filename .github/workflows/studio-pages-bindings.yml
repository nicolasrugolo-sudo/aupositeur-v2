name: Bind Studio Workers to existing Pages project
on:
  push:
    branches: [main]
    paths: ['.github/workflows/studio-pages-bindings.yml']
permissions:
  contents: read
jobs:
  bind:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Add production service bindings
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects"
          curl -fsS -H "Authorization: Bearer $CF_TOKEN" "$endpoint?per_page=100" > "$RUNNER_TEMP/projects.json"
          project=$(jq -er '[.result[] | select((.domains // []) | index("www.aupositeur.be"))] | if length == 1 then .[0].name else error("Expected exactly one Pages project for www.aupositeur.be") end' "$RUNNER_TEMP/projects.json")
          curl -fsS -H "Authorization: Bearer $CF_TOKEN" "$endpoint/$project" > "$RUNNER_TEMP/project.json"
          jq -e '.result.production_branch == "main"' "$RUNNER_TEMP/project.json" >/dev/null
          jq -ec --arg audio aupositeur-media-api --arg insights aupositeur-google-insights '
            (.result.deployment_configs.production.services // {}) as $old |
            if (($old.STUDIO_AUDIO.service // $audio) != $audio or ($old.STUDIO_INSIGHTS.service // $insights) != $insights)
            then error("Conflicting production service binding") else null end |
            {deployment_configs:{production:{services:($old + {STUDIO_AUDIO:{service:$audio,environment:"production"},STUDIO_INSIGHTS:{service:$insights,environment:"production"}})}}}
          ' "$RUNNER_TEMP/project.json" > "$RUNNER_TEMP/patch.json"
          code=$(curl -sS -o "$RUNNER_TEMP/patched.json" -w '%{http_code}' -X PATCH -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/patch.json" "$endpoint/$project")
          if [[ "$code" != 200 ]]; then
            jq -c '{error_codes:[.errors[]?.code]}' "$RUNNER_TEMP/patched.json"
            printf 'Cloudflare Pages PATCH returned HTTP %s\n' "$code"
            exit 1
          fi
          jq -e '.success == true and .result.deployment_configs.production.services.STUDIO_AUDIO.service == "aupositeur-media-api" and .result.deployment_configs.production.services.STUDIO_INSIGHTS.service == "aupositeur-google-insights"' "$RUNNER_TEMP/patched.json" >/dev/null
          printf 'Production service bindings verified for %s\n' "$project"
