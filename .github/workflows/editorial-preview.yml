name: Editorial preview

on:
  push:
    branches: [refonte/aupositeur-editorial]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify public output
        run: |
          for route in index.html ecrits/index.html reflexions/index.html livres/index.html musique/index.html robots.txt sitemap.xml; do
            test -s "dist/$route"
          done
          grep -q 'ap-home-masthead' dist/index.html
          grep -q 'rel="canonical"' dist/index.html
      - name: Exclude the live administration from the downloadable preview
        run: rm -rf dist/admin
      - uses: actions/upload-artifact@v4
        with:
          name: aupositeur-editorial-preview
          path: dist/
          retention-days: 7
      - name: Capture the homepage at desktop and mobile widths
        run: |
          npx --yes playwright install --with-deps chromium
          npx astro preview --host 127.0.0.1 --port 4321 &
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4321/ -o /dev/null; then break; fi
            sleep 1
          done
          mkdir screenshots
          npx --yes playwright screenshot --viewport-size="1440,900" http://127.0.0.1:4321/ screenshots/accueil-ordinateur.png
          npx --yes playwright screenshot --viewport-size="390,844" http://127.0.0.1:4321/ screenshots/accueil-mobile.png
      - uses: actions/upload-artifact@v4
        with:
          name: aupositeur-homepage-screenshots
          path: screenshots/
          retention-days: 7
      - name: Check out the exact before revision
        uses: actions/checkout@v4
        with:
          ref: aaf3f76ceced8b5f32869e8dcf32e51dad8dd8e3
          path: reading-baseline
      - name: Check out the exact Phase 2 revision
        uses: actions/checkout@v4
        with:
          ref: 9fa5d4fc0190f7795fe55d1235158c8d7ac6d390
          path: reading-phase-two
      - name: Verify work sources and build both references
        run: |
          test "$(git -C reading-baseline rev-parse HEAD)" = aaf3f76ceced8b5f32869e8dcf32e51dad8dd8e3
          test "$(git -C reading-phase-two rev-parse HEAD)" = 9fa5d4fc0190f7795fe55d1235158c8d7ac6d390
          for revision in reading-baseline reading-phase-two; do
            diff -qr "$revision/src/content" src/content
            diff -q "$revision/src/pages/index.astro" src/pages/index.astro
            (cd "$revision" && npm ci && npm run build && git rev-parse HEAD | tr -d '\n' > dist/__revision.txt)
          done
          printf '%s' "$GITHUB_SHA" > dist/__revision.txt
      - name: Compare isolated static builds in Chromium
        run: |
          npm install --no-save --package-lock=false playwright axe-core pngjs
          npx playwright install chromium
          python3 -m http.server 4322 --bind 127.0.0.1 --directory reading-baseline/dist &
          python3 -m http.server 4323 --bind 127.0.0.1 --directory reading-phase-two/dist &
          python3 -m http.server 4324 --bind 127.0.0.1 --directory dist &
          for port in 4322 4323 4324; do
            curl --retry 20 --retry-connrefused --retry-delay 1 -fsS "http://127.0.0.1:$port/__revision.txt" -o /dev/null
          done
          node scripts/check-reading.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aupositeur-lecture-revisions-verifiees
          path: reading-screenshots/
          if-no-files-found: ignore
          retention-days: 7
