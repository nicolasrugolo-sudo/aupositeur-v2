name: Editorial preview

on:
  push:
    branches: [refonte/aupositeur-editorial]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify public output
        run: |
          for route in index.html ecrits/index.html reflexions/index.html livres/index.html musique/index.html robots.txt sitemap.xml; do
            test -s "dist/$route"
          done
          grep -q 'ap-home-masthead' dist/index.html
          grep -q 'rel="canonical"' dist/index.html
      - name: Exclude the live administration from the downloadable preview
        run: rm -rf dist/admin
      - uses: actions/upload-artifact@v4
        with:
          name: aupositeur-editorial-preview
          path: dist/
          retention-days: 7
      - name: Capture the homepage at desktop and mobile widths
        run: |
          npx --yes playwright install --with-deps chromium
          npx astro preview --host 127.0.0.1 --port 4321 &
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4321/ -o /dev/null; then break; fi
            sleep 1
          done
          mkdir screenshots
          npx --yes playwright screenshot --viewport-size="1440,900" http://127.0.0.1:4321/ screenshots/accueil-ordinateur.png
          npx --yes playwright screenshot --viewport-size="390,844" http://127.0.0.1:4321/ screenshots/accueil-mobile.png
      - uses: actions/upload-artifact@v4
        with:
          name: aupositeur-homepage-screenshots
          path: screenshots/
          retention-days: 7
      - name: Check out the reading baseline
        uses: actions/checkout@v4
        with:
          ref: aaf3f76ceced8b5f32869e8dcf32e51dad8dd8e3
          path: reading-baseline
      - name: Verify original works and build the baseline
        run: |
          diff -qr reading-baseline/src/content src/content
          diff -q reading-baseline/src/pages/index.astro src/pages/index.astro
          cd reading-baseline
          npm ci
          npm run build
      - name: Compare reading pages in Chromium
        run: |
          npm install --no-save --package-lock=false playwright axe-core
          npx playwright install chromium
          npx astro preview --host 127.0.0.1 --port 4321 > /tmp/editorial-preview.log 2>&1 &
          (cd reading-baseline && npx astro preview --host 127.0.0.1 --port 4322) > /tmp/editorial-baseline.log 2>&1 &
          for port in 4321 4322; do
            curl --retry 20 --retry-connrefused --retry-delay 1 -fsS "http://127.0.0.1:$port/" -o /dev/null
          done
          node scripts/check-reading.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aupositeur-lecture-avant-apres
          path: reading-screenshots/
          if-no-files-found: ignore
          retention-days: 7
