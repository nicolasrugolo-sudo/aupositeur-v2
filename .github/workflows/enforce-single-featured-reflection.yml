name: Enforce single featured reflection

on:
  push:
    branches:
      - main
    paths:
      - 'src/content/reflexions/*.md'

permissions:
  contents: write

concurrency:
  group: featured-reflection-main
  cancel-in-progress: false

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Run normalization regression tests
        run: python scripts/test-normalize-featured-reflections.py

      - name: Keep only the selected reflection
        run: python scripts/normalize-featured-reflections.py

      - name: Commit normalization
        shell: bash
        run: |
          if git diff --quiet -- src/content/reflexions; then
            echo "No normalization needed."
            exit 0
          fi
          git config user.name "Aupositeur CMS"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/reflexions
          git commit -m "chore: keep a single featured reflection"
          git push
