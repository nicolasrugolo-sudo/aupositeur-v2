name: Enforce single featured reflection

on:
  push:
    branches:
      - main
    paths:
      - 'src/content/reflexions/*.md'

permissions:
  contents: write

concurrency:
  group: featured-reflection-main
  cancel-in-progress: false

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Keep only the selected reflection
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          root = Path('src/content/reflexions')
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'HEAD^', 'HEAD', '--', str(root)],
              text=True,
          ).splitlines()

          def is_featured(path):
              return bool(re.search(r'(?m)^featured:\s*true\s*$', path.read_text(encoding='utf-8')))

          candidates = [Path(p) for p in changed if p.endswith('.md') and Path(p).exists() and is_featured(Path(p))]
          if not candidates:
              print('No newly featured reflection; no changes.')
              raise SystemExit(0)

          # Multiple promotions in one commit: choose the last filename
          # deterministically instead of leaving several featured entries.
          winner = sorted(candidates, key=lambda path: path.as_posix())[-1]
          if len(candidates) > 1:
              print(f'Multiple featured reflections in one commit ({len(candidates)}); keeping {winner.name}.')
          for path in root.glob('*.md'):
              if path == winner:
                  continue
              before = path.read_text(encoding='utf-8')
              after = re.sub(r'(?m)^featured:\s*true\s*$', 'featured: false', before)
              if after != before:
                  path.write_text(after, encoding='utf-8', newline='\n')
                  print(f'Unfeatured {path.name}; keeping {winner.name}')

      - name: Commit normalization
        shell: bash
        run: |
          if git diff --quiet -- src/content/reflexions; then
            echo "No normalization needed."
            exit 0
          fi
          git config user.name "Aupositeur CMS"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/reflexions
          git commit -m "chore: keep a single featured reflection"
          git push
