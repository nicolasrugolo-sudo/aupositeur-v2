name: Community feature checks
on:
  push:
    branches:
      - feature/communaute-commentaires-abonnes
      - main
  pull_request:
    paths:
      - 'workers/community-api/**'
      - 'src/components/Community*'
      - 'src/pages/**'
      - 'public/admin/community-*'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: node --check workers/community-api/index.js
      - run: node --check public/admin/community-admin.js
      - run: node --test tests/community-api.test.mjs tests/community-pages-gateway.test.mjs
      - run: npm run build
