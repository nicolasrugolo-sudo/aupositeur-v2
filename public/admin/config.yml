    identifier_field: "title"
    slug: "{{slug}}"
    summary: "{{title}}"

    fields:

      - label: "Titre"
        name: "title"
        widget: "string"

      - label: "Description"
        name: "description"
        widget: "text"
        required: false

      - label: "AnnÃ©e"
        name: "year"
        widget: "number"
        value_type: "int"
        required: false

      - label: "ThÃ¨mes"
        name: "themes"
        widget: "list"
        required: false
        default: []

      - label: "Mise en avant"
        name: "featured"
        widget: "boolean"
        default: false

      - label: "Brouillon"
        name: "draft"
        widget: "boolean"
        default: false

      - label: "Texte"
        name: "body"
        widget: "markdown"
  # ==========================================================
  # MUSIQUES
  # ==========================================================

  - name: "musiques"
    label: "Musiques"
    label_singular: "Musique"
    folder: "src/content/musiques"
    create: true
