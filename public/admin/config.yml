backend:
  name: github
  repo: nicolasrugolo-sudo/aupositeur-v2
  branch: main
  base_url: https://aupositeur-decap-oauth.nicolas-rugolo.workers.dev
  auth_endpoint: /auth
  auth_scope: public_repo
  site_domain: www.aupositeur.be

media_folder: "public/images"
public_folder: "/images"

collections:

  # ==========================================================
  # CITATIONS
  # ==========================================================

  - name: "citations"
    label: "Citations"
    label_singular: "Citation"
    folder: "src/content/citations"
    create: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "text"
    slug: "{{slug}}"
    summary: "{{text}}"

    fields:
      - label: "Texte"
        name: "text"
        widget: "text"

      - label: "Auteur"
        name: "author"
        widget: "string"
        default: "Aupositeur"

      - label: "Date d’ajout"
        name: "createdAt"
        widget: "datetime"
        default: "{{now}}"
        hint: "Définie automatiquement à la création ; elle détermine l’ordre d’affichage."

      - label: "Source"
        name: "source"
        widget: "string"
        required: false
        hint: "Référence interne de la source originale."

      - label: "Vidéo"
        name: "video"
        widget: "file"
        required: false
        media_folder: "/public/videos/citations"
        public_folder: "/videos/citations"
        hint: "Sélectionne ou téléverse la vidéo associée à cette citation."

      - label: "Mise en avant"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "Sélection éditoriale AUPOSITEUR. Maximum 3 contenus mis en avant dans cette rubrique."

      - label: "Brouillon"
        name: "draft"
        widget: "boolean"
        default: false

  # ==========================================================
  # ÉCRITS
  # ==========================================================

  - name: "ecrits"
    label: "Écrits"
    label_singular: "Écrit"
    folder: "src/content/poemes"
    create: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    slug: "{{slug}}"
    summary: "{{title}}"

    fields:
      - label: "Titre"
        name: "title"
        widget: "string"

      - label: "Description"
        name: "description"
        widget: "text"
        required: false

      - label: "Photo de partage"
        name: "socialPhoto"
        widget: "image"
        required: false
        default: "/images/portait-aupositeur.png"
        media_folder: "/public/images"
        public_folder: "/images"
        hint: "Portrait utilisé pour l’aperçu du lien sur les réseaux sociaux."

      - label: "Année"
        name: "year"
        widget: "number"
        value_type: "int"
        required: false

      - label: "Date d’ajout"
        name: "createdAt"
        widget: "datetime"
        default: "{{now}}"
        hint: "Définie automatiquement à la création ; elle détermine l’ordre d’affichage des nouveaux écrits."

      - label: "Thèmes"
        name: "themes"
        widget: "list"
        required: false
        default: []

      - label: "Mise en avant"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "Sélection éditoriale AUPOSITEUR. Maximum 3 contenus mis en avant dans cette rubrique."

      - label: "Brouillon"
        name: "draft"
        widget: "boolean"
        default: false

      - label: "Texte"
        name: "body"
        widget: "markdown"

  # ==========================================================
  # MUSIQUES
  # ==========================================================

  - name: "musiques"
    label: "Musiques"
    label_singular: "Morceau"
    folder: "src/content/musiques"
    create: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    slug: "{{slug}}"
    summary: "{{title}}"
    description: "Catalogue musical AUPOSITEUR. Chaque morceau publié possède automatiquement sa page /musique/{slug}/."

    fields:
      - { label: "Titre", name: "title", widget: "string", hint: "Le nom du fichier et l’URL sont générés à la création à partir du titre." }

      - label: "Type"
        name: "kind"
        widget: "select"
        options:
          - { label: "Composition originale", value: "composition" }
          - { label: "Reprise", value: "reprise" }

      - label: "Pochette"
        name: "cover"
        widget: "image"
        required: false
        media_folder: "/public/images"
        public_folder: "/images"
        choose_url: false
        hint: "Recommandé : image carrée 1600 × 1600 px, WebP ou JPEG. Les morceaux historiques sans pochette continuent d’utiliser leur miniature YouTube."

      - label: "Description courte"
        name: "descriptionCourte"
        widget: "text"
        required: false
        hint: "Quelques lignes pour présenter le morceau dans le catalogue et les aperçus."

      - label: "À propos du morceau"
        name: "descriptionLongue"
        widget: "text"
        required: false
        hint: "Présentation développée affichée sur la page individuelle."

      - label: "Date de sortie"
        name: "releaseDate"
        widget: "datetime"
        required: false
        date_format: "DD/MM/YYYY"
        time_format: false
        format: "YYYY-MM-DD"

      - label: "Fichier audio"
        name: "audioKey"
        widget: "aupositeur-audio-file"
        required: false
        hint: "Audio public stocké dans Cloudflare R2, jamais dans GitHub. MP3 recommandé pour le Web. Le bouton Remplacer conserve la fiche du morceau."

      - label: "YouTube"
        name: "youtubeId"
        widget: "string"
        required: false
        hint: "Colle l’URL YouTube complète (youtube.com ou youtu.be) ou simplement l’ID de la vidéo."

      - label: "Lien Spotify"
        name: "spotifyUrl"
        widget: "string"
        required: false
        hint: "URL Spotify complète. Conservé pour compatibilité avec les morceaux existants."

      - label: "Autres plateformes"
        name: "links"
        widget: "list"
        required: false
        default: []
        collapsed: true
        summary: "{{fields.platform}} — {{fields.label}}"
        fields:
          - label: "Plateforme"
            name: "platform"
            widget: "select"
            options:
              - { label: "YouTube", value: "youtube" }
              - { label: "Spotify", value: "spotify" }
              - { label: "Apple Music", value: "apple-music" }
              - { label: "Deezer", value: "deezer" }
              - { label: "SoundCloud", value: "soundcloud" }
              - { label: "Bandcamp", value: "bandcamp" }
              - { label: "Autre", value: "autre" }
          - { label: "URL", name: "url", widget: "string" }
          - { label: "Libellé personnalisé", name: "label", widget: "string", required: false }

      - label: "Paroles"
        name: "lyrics"
        widget: "text"
        required: false
        hint: "Paroles complètes. Les retours à la ligne sont conservés sur la page."

      - { label: "Paroles par", name: "lyricsBy", widget: "string", required: false, default: "AUPOSITEUR" }
      - { label: "Musique par", name: "musicBy", widget: "string", required: false }
      - { label: "Interprétation", name: "performedBy", widget: "string", required: false }
      - { label: "Arrangement", name: "arrangementBy", widget: "string", required: false }
      - { label: "Production", name: "productionBy", widget: "string", required: false }
      - { label: "Mixage", name: "mixingBy", widget: "string", required: false }
      - { label: "Mastering", name: "masteringBy", widget: "string", required: false }
      - { label: "Copyright / année", name: "copyright", widget: "string", required: false }

      - label: "Crédits supplémentaires"
        name: "credits"
        widget: "list"
        required: false
        default: []
        collapsed: true
        summary: "{{fields.role}} — {{fields.name}}"
        fields:
          - { label: "Rôle", name: "role", widget: "string" }
          - { label: "Nom", name: "name", widget: "string" }

      - { label: "Ordre d’affichage", name: "order", widget: "number", value_type: "int", default: 99 }
      - { label: "Mise en avant", name: "featured", widget: "boolean", default: false, hint: "Sélection éditoriale AUPOSITEUR. Maximum 3 morceaux mis en avant." }
      - { label: "Brouillon", name: "draft", widget: "boolean", default: true, hint: "Laisse activé tant que la fiche n’est pas prête à être publique." }

  # ==========================================================
  # LIVRES
  # ==========================================================

  - name: "livres"
    label: "Livres"
    label_singular: "Livre"
    folder: "src/content/livres"
    create: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    slug: "{{slug}}"
    summary: "{{title}}"

    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Sous-titre", name: "subtitle", widget: "string", required: false }
      - { label: "Couverture", name: "cover", widget: "image" }
      - { label: "Auteur", name: "author", widget: "string", default: "Aupositeur" }
      - { label: "Illustrations", name: "illustrator", widget: "string", required: false }
      - { label: "Éditeur", name: "publisher", widget: "string", required: false }
      - { label: "Prix", name: "price", widget: "number", value_type: "float" }
      - { label: "Devise", name: "currency", widget: "string", default: "EUR" }
      - { label: "Lien d’achat", name: "purchaseUrl", widget: "string" }
      - { label: "Accroche", name: "lead", widget: "text" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Livre présenté sur l’accueil", name: "featured", widget: "boolean", default: false, hint: "Un seul livre peut être présenté sur l’accueil. Si tu actives celui-ci, l’ancienne mise en avant sera retirée automatiquement." }
      - { label: "Brouillon", name: "draft", widget: "boolean", default: false, hint: "Active cette option tant que la fiche du livre n’est pas prête à être publique." }
      - { label: "Texte", name: "body", widget: "markdown" }

  # ==========================================================
  # BOUTIQUE
  # ==========================================================

  - name: "boutique"
    label: "Boutique"
    label_singular: "Produit"
    folder: "src/content/boutique"
    create: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    slug: "{{slug}}"
    summary: "{{number}} — {{title}}"

    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Numéro", name: "number", widget: "string" }
      - { label: "Citation", name: "quote", widget: "text" }
      - { label: "Prix", name: "price", widget: "number", value_type: "float" }
      - { label: "Devise", name: "currency", widget: "string", default: "EUR" }
      - { label: "Type de produit", name: "productType", widget: "string", default: "affiche-encadree" }
      - { label: "Format", name: "size", widget: "string", default: "30x40" }

      - label: "Image principale"
        name: "featuredImage"
        widget: "image"
        required: false
        hint: "Surcharge facultative. Si elle est vide, la boutique utilise les visuels automatiques ou les mockups existants."

      - label: "Fabrication / expédition"
        name: "fulfillmentProvider"
        widget: "select"
        default: "gelato"
        options:
          - { label: "Gelato", value: "gelato" }
          - { label: "Manuel", value: "manual" }
        hint: "Gelato reste invisible pour le client : ce champ indique seulement qui fabrique et expédie le produit."

      - label: "ID du modèle Gelato"
        name: "gelatoTemplateId"
        widget: "string"
        required: false
        hint: "Colle uniquement l’ID du template Gelato. Les variantes physiques sont résolues automatiquement par le Worker."

      - label: "Fichier d’impression HD"
        name: "printFileKey"
        widget: "aupositeur-print-file"
        required: false
        hint: "Fichier maître privé envoyé dans Cloudflare R2. Il ne doit jamais être placé dans GitHub ou dans /public."

      - label: "Nom du fichier HD"
        name: "printFileName"
        widget: "hidden"
        required: false

      - label: "Type MIME du fichier HD"
        name: "printFileMime"
        widget: "hidden"
        required: false

      - label: "Poids du fichier HD"
        name: "printFileBytes"
        widget: "hidden"
        required: false

      - label: "Visuels de mise en situation"
        name: "mockupMode"
        widget: "select"
        default: "auto"
        options:
          - { label: "Automatiques Aupositeur", value: "auto" }
          - { label: "Images manuelles", value: "manual" }
        hint: "Pour les cadres 30 × 40 cm, le mode automatique utilise les scènes Aupositeur standardisées."

      - label: "Template de scènes"
        name: "mockupTemplate"
        widget: "select"
        default: "framed-30x40-v1"
        options:
          - { label: "Cadre 30 × 40 — Aupositeur v1", value: "framed-30x40-v1" }
        hint: "Le même gabarit réaliste est réutilisé pour toutes les affiches encadrées 30 × 40 cm."

      - label: "Mockups manuels / surcharge"
        name: "mockups"
        widget: "list"
        required: false
        default: []
        collapsed: true
        hint: "Facultatif. Sert uniquement à remplacer ou compléter les visuels automatiques."
        fields:
          - { label: "Libellé", name: "label", widget: "string" }
          - { label: "Image", name: "image", widget: "image" }

      - label: "Variantes"
        name: "variants"
        widget: "list"
        required: false
        default: []
        hint: "Compatibilité / secours. Pour les cadres standards, le Worker résout automatiquement les Product UID depuis le Template ID."
        fields:
          - { label: "SKU Aupositeur", name: "sku", widget: "string" }
          - { label: "Libellé", name: "label", widget: "string" }
          - { label: "Product UID Gelato", name: "gelatoProductUid", widget: "string", required: false }
          - { label: "Prix spécifique", name: "price", widget: "number", value_type: "float", required: false }
          - { label: "Disponible", name: "available", widget: "boolean", default: true }

      - { label: "Mise en avant", name: "featured", widget: "boolean", default: false, hint: "La page d’accueil affiche au maximum trois produits mis en avant." }
      - { label: "Brouillon", name: "draft", widget: "boolean", default: false }

  # ==========================================================
  # PAGES ET RÉGLAGES
  # ==========================================================

  - name: "pages"
    label: "Pages"
    files:
      - name: "home"
        label: "Accueil"
        file: "src/content/pages/home.json"
        format: "json"
        fields:
          - { label: "Titre principal", name: "heroTitle", widget: "string" }
          - { label: "Titre accentué", name: "heroEmphasis", widget: "string" }
          - { label: "Introduction", name: "heroIntro", widget: "list" }
          - { label: "Portrait", name: "portrait", widget: "image" }
          - { label: "Libellé Découvrir", name: "discoverLabel", widget: "string" }
          - { label: "Rubrique lecture", name: "readingLabel", widget: "string" }
          - { label: "Titre lecture", name: "readingTitle", widget: "string" }
          - { label: "Titre lecture accentué", name: "readingEmphasis", widget: "string" }
          - { label: "Extrait lecture", name: "readingExcerpt", widget: "list" }
          - { label: "Type de lecture", name: "readingType", widget: "string" }
          - { label: "Libellé du lien lecture", name: "readingLinkLabel", widget: "string" }
          - { label: "Rubrique citation", name: "quoteLabel", widget: "string" }
          - { label: "Citation", name: "quote", widget: "list" }
          - { label: "Libellé autres citations", name: "quotesLinkLabel", widget: "string" }
          - { label: "Rubrique musique", name: "musicLabel", widget: "string" }
          - { label: "Titre musique", name: "musicTitle", widget: "string" }
          - { label: "Type de musique", name: "musicType", widget: "string" }
          - { label: "Libellé écouter", name: "musicLinkLabel", widget: "string" }
          - { label: "Libellé toutes les musiques", name: "allMusicLabel", widget: "string" }

          - label: "Boutique sur l’accueil"
            name: "shopEnabled"
            widget: "boolean"
            default: true
            hint: "Affiche ou masque l’appel vers la boutique Fourthwall sur la page d’accueil."

          - { label: "Rubrique boutique", name: "shopLabel", widget: "string", default: "La boutique" }
          - { label: "Titre boutique", name: "shopTitle", widget: "string", default: "Des mots à garder" }
          - { label: "Titre boutique accentué", name: "shopEmphasis", widget: "string", default: "près de soi." }
          - { label: "Texte boutique", name: "shopText", widget: "text", required: false, hint: "Court texte facultatif affiché dans l’appel vers Fourthwall." }
          - label: "Visuel boutique"
            name: "shopVisual"
            widget: "image"
            required: false
            media_folder: "/public/images"
            public_folder: "/images"
            hint: "Visuel éditorial facultatif pour présenter la boutique sur l’accueil."
          - { label: "Libellé du bouton boutique", name: "shopLinkLabel", widget: "string", default: "Découvrir la boutique" }
          - { label: "Lien Fourthwall", name: "shopUrl", widget: "string", default: "https://aupositeur-shop.fourthwall.com/", hint: "Adresse de la boutique AUPOSITEUR hébergée sur Fourthwall." }

      - name: "about"
        label: "À propos"
        file: "src/content/pages/about.json"
        format: "json"
        fields:
          - { label: "Titre SEO", name: "seoTitle", widget: "string" }
          - { label: "Description SEO", name: "seoDescription", widget: "text" }
          - { label: "Libellé de section", name: "sectionLabel", widget: "string" }
          - { label: "Numéro de section", name: "sectionNumber", widget: "string" }
          - { label: "Portrait", name: "portrait", widget: "image" }
          - { label: "Surtitre", name: "kicker", widget: "string" }
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Titre accentué", name: "titleEmphasis", widget: "string" }
          - { label: "Identité", name: "identity", widget: "string" }
          - { label: "Lieu", name: "location", widget: "string" }
          - { label: "Introduction", name: "lead", widget: "text" }
          - { label: "Colonnes", name: "columns", widget: "list" }
          - { label: "Citation", name: "quote", widget: "string" }
          - { label: "Citation accentuée", name: "quoteEmphasis", widget: "string" }
          - label: "Principes"
            name: "principles"
            widget: "list"
            fields:
              - { label: "Numéro", name: "number", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Texte", name: "text", widget: "text" }
          - { label: "Conclusion", name: "ending", widget: "list" }
          - { label: "Signature", name: "endingCaption", widget: "string" }

  - name: "settings"
    label: "Réglages"
    files:
      - name: "site"
        label: "Site, navigation et footer"
        file: "src/content/settings/site.json"
        format: "json"
        fields:
          - { label: "Nom du site", name: "siteName", widget: "string" }
          - { label: "Titre SEO par défaut", name: "defaultTitle", widget: "string" }
          - { label: "Description SEO par défaut", name: "defaultDescription", widget: "text" }
          - { label: "Langue", name: "locale", widget: "string" }
          - { label: "Couleur du navigateur", name: "themeColor", widget: "string" }
          - { label: "Signature du menu", name: "tagline", widget: "string" }
          - { label: "Sous-titre du footer", name: "footerSubtitle", widget: "string" }
          - { label: "Texte du footer", name: "footerStatement", widget: "list" }
          - { label: "Lieu", name: "location", widget: "string" }
          - { label: "Libellé À propos", name: "aboutLabel", widget: "string" }
          - label: "Navigation principale"
            name: "navigation"
            widget: "list"
            fields:
              - { label: "Adresse", name: "href", widget: "string" }
              - { label: "Libellé", name: "label", widget: "string" }
          - label: "Navigation du footer"
            name: "footerNavigation"
            widget: "list"
            fields:
              - { label: "Numéro", name: "number", widget: "string" }
              - { label: "Adresse", name: "href", widget: "string" }
              - { label: "Libellé", name: "label", widget: "string" }