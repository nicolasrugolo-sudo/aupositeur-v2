backend:
  name: github
  repo: nicolasrugolo-sudo/aupositeur-v2
  branch: migration/decap
  base_url: https://aupositeur-decap-oauth.nicolas-rugolo.workers.dev
  auth_endpoint: /auth
  auth_scope: public_repo
  site_domain: migration-decap.aupositeur-site.pages.dev

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:

  # ==========================================================
  # CITATIONS
  # ==========================================================

  - name: "citations"
    label: "Citations"
    label_singular: "Citation"
    folder: "src/content/citations"
    create: false
    extension: "md"
    format: "frontmatter"
    identifier_field: "text"
    summary: "{{text}}"

    fields:

      - label: "Texte"
        name: "text"
        widget: "text"

      - label: "Auteur"
        name: "author"
        widget: "string"
        default: "Aupositeur"

      - label: "Source"
        name: "source"
        widget: "string"
        required: false
        hint: "RÃ©fÃ©rence interne de la source originale."

      - label: "VidÃ©o"
        name: "video"
        widget: "string"
        required: false
        hint: "Chemin de la vidÃ©o associÃ©e, si elle existe."

      - label: "Mise en avant"
        name: "featured"
        widget: "boolean"
        default: false

      - label: "Brouillon"
        name: "draft"
        widget: "boolean"
        default: false

  # ==========================================================
  # Ã‰CRITS
  # ==========================================================

  - name: "ecrits"
    label: "Ã‰crits"
