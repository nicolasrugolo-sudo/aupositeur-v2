backend:
  name: github
  repo: nicolasrugolo-sudo/aupositeur-v2
  branch: main
  base_url: https://aupositeur-decap-oauth.nicolas-rugolo.workers.dev
  auth_endpoint: /auth
  auth_scope: public_repo
  site_domain: www.aupositeur.be

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:

  # ==========================================================
  # CITATIONS
  # ==========================================================

  - name: "citations"
    label: "Citations"
    label_singular: "Citation"
    folder: "src/content/citations"
    create: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "text"
    slug: "{{slug}}"
    summary: "{{text}}"

    fields:
      - label: "Texte"
        name: "text"
        widget: "text"

      - label: "Auteur"
        name: "author"
        widget: "string"
        default: "Aupositeur"

      - label: "Date d’ajout"
        name: "createdAt"
        widget: "datetime"
        default: "{{now}}"
        hint: "Définie automatiquement à la création ; elle détermine l’ordre d’affichage."

      - label: "Source"
        name: "source"
        widget: "string"
        required: false
        hint: "Référence interne de la source originale."

      - label: "Vidéo"
        name: "video"
        widget: "string"
        required: false
        hint: "Chemin de la vidéo associée, si elle existe."

      - label: "Mise en avant"
        name: "featured"
        widget: "boolean"
        default: false

      - label: "Brouillon"
        name: "draft"
        widget: "boolean"
        default: false

  # ==========================================================
  # ÉCRITS
  # ==========================================================

  - name: "ecrits"
    label: "Écrits"
    label_singular: "Écrit"
    folder: "src/content/poemes"
    create: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    slug: "{{slug}}"
    summary: "{{title}}"

    fields:
      - label: "Titre"
        name: "title"
        widget: "string"

      - label: "Description"
        name: "description"
        widget: "text"
        required: false

      - label: "Photo de partage"
        name: "socialPhoto"
        widget: "select"
        required: false
        default: "/images/aupositeur/portraits/aupositeur-01.png"
        hint: "Portrait utilisé pour l’aperçu du lien sur les réseaux sociaux."
        options:
          - { label: "Portrait 01", value: "/images/aupositeur/portraits/aupositeur-01.png" }
          - { label: "Portrait 02", value: "/images/aupositeur/portraits/aupositeur-02.png" }
          - { label: "Portrait 03", value: "/images/aupositeur/portraits/aupositeur-03.png" }
          - { label: "Portrait 04", value: "/images/aupositeur/portraits/aupositeur-04.png" }
          - { label: "Portrait 05", value: "/images/aupositeur/portraits/aupositeur-05.png" }
          - { label: "Portrait 06", value: "/images/aupositeur/portraits/aupositeur-06.png" }
          - { label: "Portrait 07", value: "/images/aupositeur/portraits/aupositeur-07.png" }
          - { label: "Portrait 08", value: "/images/aupositeur/portraits/aupositeur-08.png" }
          - { label: "Portrait 09", value: "/images/aupositeur/portraits/aupositeur-09.png" }
          - { label: "Portrait 10", value: "/images/aupositeur/portraits/aupositeur-10.png" }
          - { label: "Portrait 11", value: "/images/aupositeur/portraits/aupositeur-11.png" }
          - { label: "Portrait 12", value: "/images/aupositeur/portraits/aupositeur-12.png" }
          - { label: "Portrait 13", value: "/images/aupositeur/portraits/aupositeur-13.png" }
          - { label: "Portrait 14", value: "/images/aupositeur/portraits/aupositeur-14.png" }
          - { label: "Portrait 15", value: "/images/aupositeur/portraits/aupositeur-15.png" }
          - { label: "Portrait 16", value: "/images/aupositeur/portraits/aupositeur-16.png" }
          - { label: "Portrait 17", value: "/images/aupositeur/portraits/aupositeur-17.png" }
          - { label: "Portrait 18", value: "/images/aupositeur/portraits/aupositeur-18.png" }
          - { label: "Portrait 19", value: "/images/aupositeur/portraits/aupositeur-19.png" }
          - { label: "Portrait 20", value: "/images/aupositeur/portraits/aupositeur-20.png" }
          - { label: "Portrait 21", value: "/images/aupositeur/portraits/aupositeur-21.png" }
          - { label: "Portrait 22", value: "/images/aupositeur/portraits/aupositeur-22.png" }
          - { label: "Portrait 23", value: "/images/aupositeur/portraits/aupositeur-23.png" }
          - { label: "Portrait 24", value: "/images/aupositeur/portraits/aupositeur-24.png" }
          - { label: "Portrait 25", value: "/images/aupositeur/portraits/aupositeur-25.png" }

      - label: "Année"
        name: "year"
        widget: "number"
        value_type: "int"
        required: false

      - label: "Date d’ajout"
        name: "createdAt"
        widget: "datetime"
        default: "{{now}}"
        hint: "Définie automatiquement à la création ; elle détermine l’ordre d’affichage des nouveaux écrits."

      - label: "Thèmes"
        name: "themes"
        widget: "list"
        required: false
        default: []

      - label: "Mise en avant"
        name: "featured"
        widget: "boolean"
        default: false

      - label: "Brouillon"
        name: "draft"
        widget: "boolean"
        default: false

      - label: "Texte"
        name: "body"
        widget: "markdown"

  # ==========================================================
  # MUSIQUES
  # ==========================================================

  - name: "musiques"
    label: "Musiques"
    label_singular: "Musique"
    folder: "src/content/musiques"
    create: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    slug: "{{slug}}"
    summary: "{{title}}"

    fields:
      - label: "Titre"
        name: "title"
        widget: "string"

      - label: "ID YouTube"
        name: "youtubeId"
        widget: "string"
        hint: "Exemple : 2HcbemC-IYY"

      - label: "Type"
        name: "kind"
        widget: "select"
        options:
          - label: "Composition"
            value: "composition"
          - label: "Reprise"
            value: "reprise"

      - label: "Ordre"
        name: "order"
        widget: "number"
        value_type: "int"

      - label: "Mise en avant"
        name: "featured"
        widget: "boolean"
        default: false

      - label: "Brouillon"
        name: "draft"
        widget: "boolean"
        default: false

  # ==========================================================
  # LIVRES
  # ==========================================================

  - name: "livres"
    label: "Livres"
    label_singular: "Livre"
    folder: "src/content/livres"
    create: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    slug: "{{slug}}"
    summary: "{{title}}"

    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Sous-titre", name: "subtitle", widget: "string", required: false }
      - { label: "Couverture", name: "cover", widget: "image" }
      - { label: "Auteur", name: "author", widget: "string", default: "Aupositeur" }
      - { label: "Illustrations", name: "illustrator", widget: "string", required: false }
      - { label: "Éditeur", name: "publisher", widget: "string", required: false }
      - { label: "Prix", name: "price", widget: "number", value_type: "float" }
      - { label: "Devise", name: "currency", widget: "string", default: "EUR" }
      - { label: "Lien d’achat", name: "purchaseUrl", widget: "string" }
      - { label: "Accroche", name: "lead", widget: "text" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Mise en avant", name: "featured", widget: "boolean", default: false }
      - { label: "Brouillon", name: "draft", widget: "boolean", default: false }
      - { label: "Texte", name: "body", widget: "markdown" }

  # ==========================================================
  # BOUTIQUE
  # ==========================================================

  - name: "boutique"
    label: "Boutique"
    label_singular: "Produit"
    folder: "src/content/boutique"
    create: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    slug: "{{slug}}"
    summary: "{{number}} — {{title}}"

    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Numéro", name: "number", widget: "string" }
      - { label: "Citation", name: "quote", widget: "text" }
      - { label: "Prix", name: "price", widget: "number", value_type: "float" }
      - { label: "Devise", name: "currency", widget: "string", default: "EUR" }
      - { label: "Type de produit", name: "productType", widget: "string", default: "affiche-encadree" }
      - { label: "Format", name: "size", widget: "string", default: "30x40" }

      - label: "Image principale"
        name: "featuredImage"
        widget: "image"
        required: false
        hint: "Surcharge facultative. Si elle est vide, la boutique utilise les visuels automatiques ou les mockups existants."

      - label: "Fabrication / expédition"
        name: "fulfillmentProvider"
        widget: "select"
        default: "gelato"
        options:
          - { label: "Gelato", value: "gelato" }
          - { label: "Manuel", value: "manual" }
        hint: "Gelato reste invisible pour le client : ce champ indique seulement qui fabrique et expédie le produit."

      - label: "ID du modèle Gelato"
        name: "gelatoTemplateId"
        widget: "string"
        required: false
        hint: "Colle uniquement l’ID du template Gelato. Les variantes physiques sont résolues automatiquement par le Worker."

      - label: "Fichier d’impression HD"
        name: "printFileKey"
        widget: "aupositeur-print-file"
        required: false
        hint: "Fichier maître privé envoyé dans Cloudflare R2. Il ne doit jamais être placé dans GitHub ou dans /public."

      - label: "Nom du fichier HD"
        name: "printFileName"
        widget: "hidden"
        required: false

      - label: "Type MIME du fichier HD"
        name: "printFileMime"
        widget: "hidden"
        required: false

      - label: "Poids du fichier HD"
        name: "printFileBytes"
        widget: "hidden"
        required: false

      - label: "Visuels de mise en situation"
        name: "mockupMode"
        widget: "select"
        default: "auto"
        options:
          - { label: "Automatiques Aupositeur", value: "auto" }
          - { label: "Images manuelles", value: "manual" }
        hint: "Pour les cadres 30 × 40 cm, le mode automatique utilise les scènes Aupositeur standardisées."

      - label: "Template de scènes"
        name: "mockupTemplate"
        widget: "select"
        default: "framed-30x40-v1"
        options:
          - { label: "Cadre 30 × 40 — Aupositeur v1", value: "framed-30x40-v1" }
        hint: "Le même gabarit réaliste est réutilisé pour toutes les affiches encadrées 30 × 40 cm."

      - label: "Mockups manuels / surcharge"
        name: "mockups"
        widget: "list"
        required: false
        default: []
        collapsed: true
        hint: "Facultatif. Sert uniquement à remplacer ou compléter les visuels automatiques."
        fields:
          - { label: "Libellé", name: "label", widget: "string" }
          - { label: "Image", name: "image", widget: "image" }

      - label: "Variantes"
        name: "variants"
        widget: "list"
        required: false
        default: []
        hint: "Compatibilité / secours. Pour les cadres standards, le Worker résout automatiquement les Product UID depuis le Template ID."
        fields:
          - { label: "SKU Aupositeur", name: "sku", widget: "string" }
          - { label: "Libellé", name: "label", widget: "string" }
          - { label: "Product UID Gelato", name: "gelatoProductUid", widget: "string", required: false }
          - { label: "Prix spécifique", name: "price", widget: "number", value_type: "float", required: false }
          - { label: "Disponible", name: "available", widget: "boolean", default: true }

      - { label: "Mise en avant", name: "featured", widget: "boolean", default: false, hint: "La page d’accueil affiche au maximum trois produits mis en avant." }
      - { label: "Brouillon", name: "draft", widget: "boolean", default: false }

  # ==========================================================
  # PAGES ET RÉGLAGES
  # ==========================================================

  - name: "pages"
    label: "Pages"
    files:
      - name: "home"
        label: "Accueil"
        file: "src/content/pages/home.json"
        format: "json"
        fields:
          - { label: "Titre principal", name: "heroTitle", widget: "string" }
          - { label: "Titre accentué", name: "heroEmphasis", widget: "string" }
          - { label: "Introduction", name: "heroIntro", widget: "list" }
          - { label: "Portrait", name: "portrait", widget: "image" }
          - { label: "Libellé Découvrir", name: "discoverLabel", widget: "string" }
          - { label: "Rubrique lecture", name: "readingLabel", widget: "string" }
          - { label: "Titre lecture", name: "readingTitle", widget: "string" }
          - { label: "Titre lecture accentué", name: "readingEmphasis", widget: "string" }
          - { label: "Extrait lecture", name: "readingExcerpt", widget: "list" }
          - { label: "Type de lecture", name: "readingType", widget: "string" }
          - { label: "Libellé du lien lecture", name: "readingLinkLabel", widget: "string" }
          - { label: "Rubrique citation", name: "quoteLabel", widget: "string" }
          - { label: "Citation", name: "quote", widget: "list" }
          - { label: "Libellé autres citations", name: "quotesLinkLabel", widget: "string" }
          - { label: "Rubrique musique", name: "musicLabel", widget: "string" }
          - { label: "Titre musique", name: "musicTitle", widget: "string" }
          - { label: "Type de musique", name: "musicType", widget: "string" }
          - { label: "Libellé écouter", name: "musicLinkLabel", widget: "string" }
          - { label: "Libellé toutes les musiques", name: "allMusicLabel", widget: "string" }

      - name: "about"
        label: "À propos"
        file: "src/content/pages/about.json"
        format: "json"
        fields:
          - { label: "Titre SEO", name: "seoTitle", widget: "string" }
          - { label: "Description SEO", name: "seoDescription", widget: "text" }
          - { label: "Libellé de section", name: "sectionLabel", widget: "string" }
          - { label: "Numéro de section", name: "sectionNumber", widget: "string" }
          - { label: "Portrait", name: "portrait", widget: "image" }
          - { label: "Surtitre", name: "kicker", widget: "string" }
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Titre accentué", name: "titleEmphasis", widget: "string" }
          - { label: "Identité", name: "identity", widget: "string" }
          - { label: "Lieu", name: "location", widget: "string" }
          - { label: "Introduction", name: "lead", widget: "text" }
          - { label: "Colonnes", name: "columns", widget: "list" }
          - { label: "Citation", name: "quote", widget: "string" }
          - { label: "Citation accentuée", name: "quoteEmphasis", widget: "string" }
          - label: "Principes"
            name: "principles"
            widget: "list"
            fields:
              - { label: "Numéro", name: "number", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Texte", name: "text", widget: "text" }
          - { label: "Conclusion", name: "ending", widget: "list" }
          - { label: "Signature", name: "endingCaption", widget: "string" }

  - name: "settings"
    label: "Réglages"
    files:
      - name: "site"
        label: "Site, navigation et footer"
        file: "src/content/settings/site.json"
        format: "json"
        fields:
          - { label: "Nom du site", name: "siteName", widget: "string" }
          - { label: "Titre SEO par défaut", name: "defaultTitle", widget: "string" }
          - { label: "Description SEO par défaut", name: "defaultDescription", widget: "text" }
          - { label: "Langue", name: "locale", widget: "string" }
          - { label: "Couleur du navigateur", name: "themeColor", widget: "string" }
          - { label: "Signature du menu", name: "tagline", widget: "string" }
          - { label: "Sous-titre du footer", name: "footerSubtitle", widget: "string" }
          - { label: "Texte du footer", name: "footerStatement", widget: "list" }
          - { label: "Lieu", name: "location", widget: "string" }
          - { label: "Libellé À propos", name: "aboutLabel", widget: "string" }
          - label: "Navigation principale"
            name: "navigation"
            widget: "list"
            fields:
              - { label: "Adresse", name: "href", widget: "string" }
              - { label: "Libellé", name: "label", widget: "string" }
          - label: "Navigation du footer"
            name: "footerNavigation"
            widget: "list"
            fields:
              - { label: "Numéro", name: "number", widget: "string" }
              - { label: "Adresse", name: "href", widget: "string" }
              - { label: "Libellé", name: "label", widget: "string" }
